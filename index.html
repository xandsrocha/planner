<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#050505;
  font-family:'Inter', sans-serif;
  color:#fff;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:30px 20px;
}

/* HEADER */

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:25px;
}

.title small{
  color:#888;
  font-size:12px;
}

.title h1{
  margin:0;
  font-size:34px;
}

.stats{
  display:flex;
  gap:30px;
  align-items:center;
}

.circle{
  width:60px;
  height:60px;
  border-radius:50%;
  border:6px solid #1f1f1f;
  position:relative;
}

.circle span{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:14px;
}

/* LEGEND */

.legend{
  display:flex;
  gap:15px;
  margin-bottom:15px;
  font-size:13px;
}

.legend span{
  display:flex;
  align-items:center;
  gap:6px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:2px;
}

/* CARD */

.card{
  display:flex;
  border-radius:20px;
  margin-bottom:12px;
  background:linear-gradient(145deg,#1b1b1b,#0f0f0f);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  overflow:hidden;
}

.left{width:35%; padding:18px;}
.middle{width:35%; padding:18px; border-left:1px solid rgba(255,255,255,0.08);}
.right{width:30%; padding:18px; border-left:1px dashed rgba(255,255,255,0.2);}

.day{
  font-size:20px;
  font-weight:600;
}

.tag{
  background:#2c2c2c;
  padding:4px 10px;
  border-radius:20px;
  font-size:11px;
  margin-left:10px;
}

.desc{color:#888; margin-top:8px; font-size:13px;}

.period{margin-top:10px; font-size:12px; color:#aaa;}

.pill{
  display:inline-block;
  padding:6px 12px;
  border-radius:20px;
  margin-top:6px;
  font-size:12px;
}

.gym{background:#dff5d5;color:#1b4d12;}
.abs{background:#dbeeff;color:#1b4d66;}
.run{background:#ffe9cc;color:#7a4d00;}
.swim{background:#d9fff2;color:#00664d;}

.notes-title{
  font-size:12px;
  color:#aaa;
  margin-bottom:10px;
}

.line{
  height:1px;
  background:#333;
  margin-bottom:10px;
}

/* CHECK */

.check{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
  font-size:13px;
}

.check input{display:none;}

.box{
  width:18px;
  height:18px;
  border:2px solid #555;
  border-radius:4px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.2s;
}

input:checked + .box{
  background:#4caf50;
  border-color:#4caf50;
}

input:checked + .box::after{
  content:"✔";
  color:#fff;
  font-size:12px;
}

/* SÁBADO */

.intense{
  border:2px solid #ff4500;
}

.banner{
  background:#ff4500;
  padding:6px 15px;
  font-size:12px;
  font-weight:600;
}
</style>
</head>

<body>

<div class="container">

<div class="top">
  <div class="title">
    <small>PLANNER DE TREINOS</small>
    <h1>Minha semana</h1>
  </div>

  <div class="stats">
    <div class="circle"><span id="percent">0%</span></div>
    <div>🔥 <span id="streak">0</span></div>
    <div>📊 Histórico</div>
  </div>
</div>

<div class="legend">
  <span><div class="dot" style="background:#4caf50"></div>Academia</span>
  <span><div class="dot" style="background:#2196f3"></div>Abdômen</span>
  <span><div class="dot" style="background:#ff9800"></div>Corrida</span>
  <span><div class="dot" style="background:#00c853"></div>Natação</span>
</div>

<div id="app"></div>

</div>

<script>

const checklist=[
"Tomou Multi Vitamínico?",
"Tomou Creatina?",
"Tomou Whey Proteína Leite?",
"Tomou Whey Proteína Carne?",
"Tomou 3 Litros de água?"
];

const days=[
  {name:"Segunda",rest:true},
  {name:"Terça",treino:[
    ["Manhã","Academia","gym"],
    ["Tarde","Abdômen","abs"]
  ]},
  {name:"Quarta",rest:true},
  {name:"Quinta",treino:[
    ["Tarde","Abdômen","abs"],
    ["Tarde","Academia","gym"],
    ["Noite","Corrida 5km","run"]
  ]},
  {name:"Sexta",treino:[
    ["Dia","Academia","gym"]
  ]},
  {name:"Sábado",intense:true,treino:[
    ["Manhã","Natação","swim"],
    ["Noite","Corrida longa +10km","run"]
  ]},
  {name:"Domingo",treino:[
    ["Dia","Academia","gym"]
  ]}
];

function save(){
  const data={};
  document.querySelectorAll("input").forEach(i=>data[i.id]=i.checked);
  localStorage.setItem("planner",JSON.stringify(data));
  update();
}

function load(){
  const data=JSON.parse(localStorage.getItem("planner")||"{}");
  document.querySelectorAll("input").forEach(i=>i.checked=data[i.id]||false);
}

function update(){
  const inputs=document.querySelectorAll("input");
  let total=inputs.length;
  let done=[...inputs].filter(i=>i.checked).length;
  let percent=Math.round((done/total)*100);

  document.getElementById("percent").innerText=percent+"%";

  let streak=0;
  days.forEach((d,i)=>{
    let ok=checklist.every((_,j)=>document.getElementById(`d${i}-${j}`).checked);
    if(ok) streak++;
  });

  document.getElementById("streak").innerText=streak;
}

const app=document.getElementById("app");

days.forEach((d,i)=>{
  let card=document.createElement("div");
  card.className="card"+(d.intense?" intense":"");

  let left=`<div class="left">
    <div class="day">${d.name} 
      <span class="tag">${d.rest?"DESCANSO":"TREINO"}</span>
    </div>`;

  if(d.rest){
    left+=`<div class="desc">Recuperação e descanso ativo</div>`;
  } else{
    d.treino.forEach(t=>{
      left+=`
      <div class="period">${t[0]}</div>
      <div class="pill ${t[2]}">${t[1]}</div>`;
    });
  }

  left+="</div>";

  let middle=`<div class="middle">
    <div class="notes-title">ANOTAÇÕES</div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="desc">Clique para adicionar</div>
  </div>`;

  let right=`<div class="right">`;

  checklist.forEach((c,j)=>{
    right+=`
    <label class="check">
      <input type="checkbox" id="d${i}-${j}" onchange="save()">
      <div class="box"></div>
      ${c}
    </label>`;
  });

  right+="</div>";

  if(d.intense){
    card.innerHTML=`<div class="banner">🔥 SÁBADO — DIA MAIS INTENSO</div>`+left+middle+right;
  }else{
    card.innerHTML=left+middle+right;
  }

  app.appendChild(card);
});

load();
update();

</script>

</body>
</html>
