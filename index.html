<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#0b0b0b;
  font-family:-apple-system;
  color:#fff;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

h1{margin-bottom:5px;}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.progress-bar{
  height:6px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin-top:5px;
  width:200px;
}

.progress{
  height:100%;
  background:#4caf50;
  width:0%;
}

.card{
  display:flex;
  justify-content:space-between;
  border-radius:18px;
  margin-top:15px;
  background:linear-gradient(145deg,#1a1a1a,#111);
  border:1px solid #2a2a2a;
  overflow:hidden;
}

.left{
  width:45%;
  padding:15px;
}

.middle{
  width:25%;
  padding:15px;
  border-left:1px solid #2a2a2a;
  border-right:1px solid #2a2a2a;
}

.right{
  width:30%;
  padding:15px;
}

.day{
  font-size:20px;
  font-weight:bold;
}

.tag{
  display:inline-block;
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
  margin-left:10px;
}

.treino{background:#dff5d5;color:#1b4d12;}
.descanso{background:#333;color:#aaa;}

.pill{
  display:inline-block;
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  margin-top:8px;
}

.gym{background:#dff5d5;color:#1b4d12;}
.abs{background:#dbeeff;color:#1b4d66;}
.run{background:#ffe9cc;color:#7a4d00;}
.swim{background:#d9fff2;color:#00664d;}

.notes{
  color:#aaa;
  font-size:12px;
}

.notes-line{
  height:1px;
  background:#333;
  margin:6px 0;
}

.checkbox{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
  cursor:pointer;
}

.checkbox input{display:none;}

.custom{
  width:18px;
  height:18px;
  border:2px solid #555;
  border-radius:4px;
  display:flex;
  align-items:center;
  justify-content:center;
}

input:checked + .custom{
  background:#4caf50;
  border-color:#4caf50;
}

input:checked + .custom::after{
  content:"✔";
  color:#fff;
  font-size:12px;
}

.intense{
  border:2px solid #ff4500;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div>
    <h1>Minha semana</h1>
    <div id="percent">0%</div>
    <div class="progress-bar"><div class="progress" id="bar"></div></div>
  </div>
  <div>
    🔥 <span id="streak">0</span>
  </div>
</div>

<div id="app"></div>

</div>

<script>

const checklist=[
"Tomou Multi Vitamínico?",
"Tomou Creatina?",
"Tomou Whey Proteína Leite?",
"Tomou Whey Proteína Carne?",
"Tomou 3 Litros de água?"
];

const days=[
  {name:"Segunda",rest:true},
  {name:"Terça",treino:["Academia","Abdômen"]},
  {name:"Quarta",rest:true},
  {name:"Quinta",treino:["Abdômen","Academia","Corrida 5km"]},
  {name:"Sexta",treino:["Academia"]},
  {name:"Sábado",treino:["Natação","Corrida 10km"],intense:true},
  {name:"Domingo",treino:["Academia"]}
];

function save(){
  const data={};
  document.querySelectorAll("input").forEach(i=>data[i.id]=i.checked);
  localStorage.setItem("planner",JSON.stringify(data));
  update();
}

function load(){
  const data=JSON.parse(localStorage.getItem("planner")||"{}");
  document.querySelectorAll("input").forEach(i=>i.checked=data[i.id]||false);
}

function update(){
  const inputs=document.querySelectorAll("input");
  let total=inputs.length;
  let done=[...inputs].filter(i=>i.checked).length;
  let percent=Math.round((done/total)*100);

  document.getElementById("percent").innerText=percent+"%";
  document.getElementById("bar").style.width=percent+"%";

  let streak=0;
  days.forEach((d,i)=>{
    let ok=checklist.every((_,j)=>document.getElementById(`d${i}-${j}`).checked);
    if(ok) streak++;
  });

  document.getElementById("streak").innerText=streak;
}

const app=document.getElementById("app");

days.forEach((d,i)=>{
  let card=document.createElement("div");
  card.className="card"+(d.intense?" intense":"");

  let left=`<div class="left">
    <div class="day">${d.name}
      <span class="tag ${d.rest?"descanso":"treino"}">
        ${d.rest?"Descanso":"Treino"}
      </span>
    </div>`;

  if(d.rest){
    left+=`<p style="color:#aaa">Recuperação</p>`;
  } else{
    d.treino.forEach(t=>{
      let cls="gym";
      if(t.includes("Abd")) cls="abs";
      if(t.includes("Corrida")) cls="run";
      if(t.includes("Natação")) cls="swim";
      left+=`<div class="pill ${cls}">${t}</div>`;
    });
  }

  left+="</div>";

  let middle=`<div class="middle">
    <div class="notes">ANOTAÇÕES</div>
    <div class="notes-line"></div>
    <div class="notes-line"></div>
  </div>`;

  let right=`<div class="right">`;

  checklist.forEach((c,j)=>{
    right+=`
    <label class="checkbox">
      <input type="checkbox" id="d${i}-${j}" onchange="save()">
      <div class="custom"></div>
      ${c}
    </label>`;
  });

  right+="</div>";

  card.innerHTML=left+middle+right;
  app.appendChild(card);
});

load();
update();

</script>

</body>
</html>
