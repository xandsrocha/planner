<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Planner Treinos</title>

<style>
body{
  margin:0;
  background:#0b0b0b;
  font-family:Arial;
  color:#fff;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.stats{
  font-size:14px;
  color:#aaa;
}

.day{
  display:flex;
  flex-wrap:wrap;
  border:1px solid #2a2a2a;
  border-radius:12px;
  margin-bottom:12px;
  overflow:hidden;
  background:#1a1a1a;
}

.left{
  padding:15px;
  flex:1;
  min-width:250px;
}

.right{
  padding:15px;
  flex:1;
  min-width:250px;
  border-left:1px solid #2a2a2a;
}

h2{
  margin:0 0 10px 0;
}

.tag{
  font-size:12px;
  padding:4px 8px;
  border-radius:20px;
  margin-left:10px;
}

.treino{ background:#dff5d5; color:#1b4d12;}
.descanso{ background:#333; color:#aaa;}

.label{
  font-size:12px;
  color:#aaa;
}

.pill{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  margin:3px 5px 0 0;
}

.gym{ background:#dff5d5; color:#1b4d12;}
.abs{ background:#dbeeff; color:#1b4d66;}
.run{ background:#ffe9cc; color:#7a4d00;}
.swim{ background:#d9fff2; color:#00664d;}

.notes{
  border-top:1px solid #333;
  margin-top:10px;
  padding-top:10px;
}

.notes div{
  height:1px;
  background:#333;
  margin:5px 0;
}

.checklist label{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
  cursor:pointer;
}

input[type="checkbox"]{
  width:16px;
  height:16px;
}

.intense{
  border:2px solid #ff4500;
}

.progress-bar{
  height:8px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin-top:5px;
}

.progress{
  height:100%;
  background:#4caf50;
  width:0%;
}
</style>
</head>

<body>
<div class="container">

<div class="header">
  <h1>Minha semana</h1>
  <div class="stats">
    <div id="streak">🔥 Streak: 0</div>
    <div id="progressText">0%</div>
    <div class="progress-bar"><div class="progress" id="progressBar"></div></div>
  </div>
</div>

<div id="app"></div>

</div>

<script>

const checklist = [
"Multi Vitamínico",
"Creatina",
"Whey Leite",
"Whey Carne",
"3L Água"
];

const days = [
  {name:"Segunda", rest:true},
  {name:"Terça", treino:[
    {p:"Manhã", t:[["Academia","gym"]]},
    {p:"Tarde", t:[["Abdômen","abs"]]}
  ]},
  {name:"Quarta", rest:true},
  {name:"Quinta", treino:[
    {p:"Tarde", t:[["Abdômen","abs"],["Academia","gym"]]},
    {p:"Noite", t:[["Corrida 5km","run"]]}
  ]},
  {name:"Sexta", treino:[
    {p:"Dia", t:[["Academia","gym"]]}
  ]},
  {name:"Sábado", intense:true, treino:[
    {p:"Manhã", t:[["Natação","swim"]]},
    {p:"Noite", t:[["Corrida 10km+","run"]]}
  ]},
  {name:"Domingo", treino:[
    {p:"Dia", t:[["Academia","gym"]]}
  ]}
];

const app = document.getElementById("app");

function saveState(){
  const data = {};
  document.querySelectorAll("input").forEach(input=>{
    data[input.id] = input.checked;
  });
  localStorage.setItem("planner", JSON.stringify(data));
  updateStats();
}

function loadState(){
  const data = JSON.parse(localStorage.getItem("planner") || "{}");
  document.querySelectorAll("input").forEach(input=>{
    input.checked = data[input.id] || false;
  });
}

function updateStats(){
  const inputs = document.querySelectorAll("input");
  let total = inputs.length;
  let done = [...inputs].filter(i=>i.checked).length;

  let percent = Math.round((done/total)*100);
  document.getElementById("progressBar").style.width = percent+"%";
  document.getElementById("progressText").innerText = percent+"%";

  // streak simples
  let streak = 0;
  days.forEach((d, i)=>{
    let dayChecks = checklist.map((_,j)=>document.getElementById(`d${i}-${j}`));
    if(dayChecks.every(c=>c.checked)) streak++;
  });

  document.getElementById("streak").innerText = "🔥 Streak: "+streak;
}

days.forEach((d, i)=>{
  const div = document.createElement("div");
  div.className = "day" + (d.intense ? " intense":"");

  let left = `<div class="left">
    <h2>${d.name}
      <span class="tag ${d.rest?"descanso":"treino"}">
      ${d.rest?"Descanso":"Treino"}
      </span>
    </h2>`;

  if(d.rest){
    left += `<p style="color:#aaa">Recuperação</p>`;
  } else {
    d.treino.forEach(sec=>{
      left += `<div>
        <div class="label">${sec.p}</div>`;
      sec.t.forEach(t=>{
        left += `<span class="pill ${t[1]}">${t[0]}</span>`;
      });
      left += `</div>`;
    });
  }

  left += `<div class="notes"><div></div><div></div></div></div>`;

  let right = `<div class="right checklist">`;
  checklist.forEach((item,j)=>{
    right += `
    <label>
      <input type="checkbox" id="d${i}-${j}" onchange="saveState()">
      ${item}
    </label>`;
  });
  right += `</div>`;

  div.innerHTML = left + right;
  app.appendChild(div);
});

loadState();
updateStats();

</script>

</body>
</html>
