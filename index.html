<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#050505;
  font-family:'Inter', sans-serif;
  color:#fff;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px;
}

/* HEADER */
.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

.title small{color:#888;font-size:12px;}
.title h1{margin:0;font-size:32px;}

.stats{
  display:flex;
  gap:20px;
  align-items:center;
}

.circle{
  width:60px;height:60px;
  border-radius:50%;
  border:6px solid #1f1f1f;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* LEGEND */
.legend{
  display:flex;
  gap:20px;
  margin-bottom:15px;
  font-size:13px;
  flex-wrap:nowrap;
}

.legend span{
  display:flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
}

.dot{
  width:10px;height:10px;border-radius:2px;
}

/* CARD */
.card{
  display:flex;
  border-radius:18px;
  margin-bottom:12px;
  background:linear-gradient(145deg,#1b1b1b,#0f0f0f);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  overflow:hidden;
}

.left{width:35%;padding:15px;}
.middle{width:35%;padding:15px;border-left:1px solid rgba(255,255,255,0.08);}
.right{width:30%;padding:15px;border-left:1px dashed rgba(255,255,255,0.2);}

.day{
  font-size:18px;
  font-weight:600;
}

.tag{
  background:#2c2c2c;
  padding:3px 10px;
  border-radius:20px;
  font-size:11px;
  margin-left:8px;
}

.desc{color:#888;font-size:13px;margin-top:6px;}

.period{margin-top:8px;font-size:12px;color:#aaa;}

.pill{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  margin-top:4px;
  font-size:12px;
}

.gym{background:#dff5d5;color:#1b4d12;}
.abs{background:#dbeeff;color:#1b4d66;}
.run{background:#ffe9cc;color:#7a4d00;}
.swim{background:#d9fff2;color:#00664d;}

/* NOTES */
.notes-title{
  font-size:12px;
  color:#aaa;
  margin-bottom:8px;
}

.notes-input{
  width:100%;
  height:70px;
  background:transparent;
  border:none;
  outline:none;
  color:#ccc;
  border-top:1px solid #333;
  padding-top:8px;
  resize:none;
}

/* CHECK */
.check{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
  font-size:13px;
  cursor:pointer;
}

.check input{display:none;}

.box{
  width:18px;height:18px;
  border:2px solid #555;
  border-radius:4px;
  display:flex;
  align-items:center;
  justify-content:center;
}

input:checked + .box{
  background:#4caf50;
  border-color:#4caf50;
}

input:checked + .box::after{
  content:"✔";
  font-size:12px;
}

/* 🔥 SÁBADO */
.intense{
  border:1.5px solid #ff4500;
}

.intense .day{
  color:#ff4500;
}

.intense-badge{
  display:inline-block;
  margin-top:6px;
  padding:4px 10px;
  border:1px solid #ff4500;
  color:#ff4500;
  border-radius:20px;
  font-size:11px;
  font-weight:600;
}
</style>
</head>

<body>

<div class="container">

<div class="top">
  <div class="title">
    <small>PLANNER DE TREINOS</small>
    <h1>Minha semana</h1>
  </div>

  <div class="stats">
    <div class="circle" id="percent">0%</div>
    🔥 <span id="streak">0</span>
  </div>
</div>

<div class="legend">
  <span><div class="dot" style="background:#4caf50"></div>Academia</span>
  <span><div class="dot" style="background:#2196f3"></div>Abdômen</span>
  <span><div class="dot" style="background:#ff9800"></div>Corrida</span>
  <span><div class="dot" style="background:#00c853"></div>Natação</span>
</div>

<div id="app"></div>

</div>

<script>

const checklist=[
"Tomou Multi Vitamínico?",
"Tomou Creatina?",
"Tomou Whey Proteína Leite?",
"Tomou Whey Proteína Carne?",
"Tomou 3 Litros de água?"
];

const days=[
  {name:"Segunda",rest:true},
  {name:"Terça",treino:[["Manhã","Academia","gym"],["Tarde","Abdômen","abs"]]},
  {name:"Quarta",rest:true},
  {name:"Quinta",treino:[["Tarde","Abdômen","abs"],["Tarde","Academia","gym"],["Noite","Corrida 5km","run"]]},
  {name:"Sexta",treino:[["Dia","Academia","gym"]]},
  {name:"Sábado",intense:true,treino:[["Manhã","Natação","swim"],["Noite","Corrida longa +10km","run"]]},
  {name:"Domingo",treino:[["Dia","Academia","gym"]]}
];

function save(){
  const data={};

  document.querySelectorAll("input").forEach(i=>data[i.id]=i.checked);
  document.querySelectorAll("textarea").forEach(t=>data[t.id]=t.value);

  localStorage.setItem("planner",JSON.stringify(data));
  update();
}

function load(){
  const data=JSON.parse(localStorage.getItem("planner")||"{}");

  document.querySelectorAll("input").forEach(i=>i.checked=data[i.id]||false);
  document.querySelectorAll("textarea").forEach(t=>t.value=data[t.id]||"");
}

function update(){
  const inputs=document.querySelectorAll("input");
  let total=inputs.length;
  let done=[...inputs].filter(i=>i.checked).length;
  let percent=Math.round((done/total)*100);

  document.getElementById("percent").innerText=percent+"%";

  let streak=0;
  days.forEach((d,i)=>{
    let ok=checklist.every((_,j)=>document.getElementById(`d${i}-${j}`).checked);
    if(ok) streak++;
  });

  document.getElementById("streak").innerText=streak;
}

const app=document.getElementById("app");

days.forEach((d,i)=>{
  let card=document.createElement("div");
  card.className="card"+(d.intense?" intense":"");

  let left=`<div class="left">
    <div class="day">${d.name}
      <span class="tag">${d.rest?"DESCANSO":"TREINO"}</span>
    </div>`;

  if(d.intense){
    left+=`<div class="intense-badge">🔥 DIA MAIS INTENSO</div>`;
  }

  if(d.rest){
    left+=`<div class="desc">Recuperação e descanso ativo</div>`;
  } else{
    d.treino.forEach(t=>{
      left+=`
      <div class="period">${t[0]}</div>
      <div class="pill ${t[2]}">${t[1]}</div>`;
    });
  }

  left+="</div>";

  let middle=`<div class="middle">
    <div class="notes-title">ANOTAÇÕES</div>
    <textarea class="notes-input" id="note-${i}" placeholder="Clique para adicionar" oninput="save()"></textarea>
  </div>`;

  let right=`<div class="right">`;

  checklist.forEach((c,j)=>{
    right+=`
    <label class="check">
      <input type="checkbox" id="d${i}-${j}" onchange="save()">
      <div class="box"></div>
      ${c}
    </label>`;
  });

  right+="</div>";

  card.innerHTML=left+middle+right;
  app.appendChild(card);
});

load();
update();

</script>

</body>
</html>
