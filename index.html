<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Planner Treinos</title>

<style>
body{
  margin:0;
  background:#0b0b0b;
  font-family:Arial;
  color:#fff;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.stats{
  font-size:14px;
  color:#aaa;
}

.history{
  margin-top:10px;
  font-size:12px;
  color:#ccc;
}

.day{
  display:flex;
  flex-wrap:wrap;
  border:1px solid #2a2a2a;
  border-radius:12px;
  margin-bottom:12px;
  overflow:hidden;
  background:#1a1a1a;
}

.left, .right{
  padding:15px;
  flex:1;
  min-width:250px;
}

.right{
  border-left:1px solid #2a2a2a;
}

.tag{
  font-size:12px;
  padding:4px 8px;
  border-radius:20px;
  margin-left:10px;
}

.treino{ background:#dff5d5; color:#1b4d12;}
.descanso{ background:#333; color:#aaa;}

.pill{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  margin:3px 5px 0 0;
}

.gym{ background:#dff5d5;}
.abs{ background:#dbeeff;}
.run{ background:#ffe9cc;}
.swim{ background:#d9fff2;}

input{ cursor:pointer; }

.progress-bar{
  height:8px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin-top:5px;
}

.progress{
  height:100%;
  background:#4caf50;
  width:0%;
}
</style>
</head>

<body>
<div class="container">

<div class="header">
  <h1>Minha semana</h1>
  <div class="stats">
    <div id="score">Score: 0%</div>
    <div id="streak">🔥 Streak: 0</div>
    <div class="progress-bar"><div class="progress" id="bar"></div></div>
    <div class="history" id="history"></div>
  </div>
</div>

<div id="app"></div>

</div>

<script>

const checklist = ["Multivitamínico","Creatina","Whey Leite","Whey Carne","3L Água"];

const days = [
  {name:"Segunda", rest:true},
  {name:"Terça", treino:[
    {p:"Manhã", t:[["Academia","gym"]]},
    {p:"Tarde", t:[["Abdômen","abs"]]}
  ]},
  {name:"Quarta", rest:true},
  {name:"Quinta", treino:[
    {p:"Tarde", t:[["Abdômen","abs"],["Academia","gym"]]},
    {p:"Noite", t:[["Corrida 5km","run"]]}
  ]},
  {name:"Sexta", treino:[{p:"Dia", t:[["Academia","gym"]]}]},
  {name:"Sábado", treino:[
    {p:"Manhã", t:[["Natação","swim"]]},
    {p:"Noite", t:[["Corrida 10km+","run"]]}
  ]},
  {name:"Domingo", treino:[{p:"Dia", t:[["Academia","gym"]]}]}
];

const app = document.getElementById("app");

function getWeek(){
  const d = new Date();
  const first = new Date(d.getFullYear(),0,1);
  return Math.ceil((((d - first)/86400000)+first.getDay()+1)/7);
}

function resetIfNewWeek(){
  const current = getWeek();
  const saved = localStorage.getItem("week");

  if(saved != current){
    localStorage.removeItem("checks");
    localStorage.setItem("week", current);
  }
}

function save(){
  const data = {};
  document.querySelectorAll("input").forEach(i=>{
    data[i.id] = i.checked;
  });
  localStorage.setItem("checks", JSON.stringify(data));
  update();
}

function load(){
  const data = JSON.parse(localStorage.getItem("checks")||"{}");
  document.querySelectorAll("input").forEach(i=>{
    i.checked = data[i.id] || false;
  });
}

function update(){
  const inputs = document.querySelectorAll("input");
  let total = inputs.length;
  let done = [...inputs].filter(i=>i.checked).length;

  let percent = Math.round((done/total)*100);
  document.getElementById("score").innerText = "Score: "+percent+"%";
  document.getElementById("bar").style.width = percent+"%";

  // histórico
  let week = getWeek();
  let history = JSON.parse(localStorage.getItem("history")||"{}");
  history[week] = percent;
  localStorage.setItem("history", JSON.stringify(history));

  document.getElementById("history").innerText =
    Object.entries(history).map(([w,v])=>`Sem ${w}: ${v}%`).join(" | ");

  // streak
  let streak = 0;
  days.forEach((d,i)=>{
    let ok = checklist.every((_,j)=>{
      let el = document.getElementById(`d${i}-${j}`);
      return el && el.checked;
    });
    if(ok) streak++;
  });

  document.getElementById("streak").innerText = "🔥 Streak: "+streak;
}

resetIfNewWeek();

days.forEach((d,i)=>{
  let div = document.createElement("div");
  div.className = "day";

  let left = `<div class="left"><h3>${d.name}</h3>`;
  if(d.rest){
    left += `<p style="color:#aaa">Descanso</p>`;
  } else {
    d.treino.forEach(sec=>{
      left += `<div>${sec.p}: `;
      sec.t.forEach(t=>{
        left += `<span class="pill ${t[1]}">${t[0]}</span>`;
      });
      left += `</div>`;
    });
  }
  left += "</div>";

  let right = `<div class="right">`;
  checklist.forEach((c,j)=>{
    right += `<label>
      <input type="checkbox" id="d${i}-${j}" onchange="save()">
      ${c}
    </label><br>`;
  });
  right += "</div>";

  div.innerHTML = left + right;
  app.appendChild(div);
});

load();
update();

</script>

</body>
</html>
