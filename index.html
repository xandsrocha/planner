<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Planner Treinos</title>

<style>
body{
  margin:0;
  background:#0b0b0b;
  font-family:'Segoe UI', sans-serif;
  color:#fff;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.stats{
  font-size:13px;
  color:#aaa;
}

.progress-bar{
  height:6px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin-top:5px;
}

.progress{
  height:100%;
  background:#4caf50;
  width:0%;
}

.day{
  display:flex;
  border:1px solid #2a2a2a;
  border-radius:14px;
  margin-bottom:12px;
  overflow:hidden;
  background:#1a1a1a;
}

.left{
  padding:15px;
  width:55%;
}

.right{
  padding:15px;
  width:45%;
  border-left:1px solid #2a2a2a;
}

h2{
  margin:0 0 10px;
  font-size:18px;
}

.tag{
  font-size:11px;
  padding:3px 8px;
  border-radius:20px;
  margin-left:8px;
}

.treino{ background:#dff5d5; color:#1b4d12;}
.descanso{ background:#333; color:#aaa;}

.pill{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  font-size:11px;
  margin:3px 5px 0 0;
}

.gym{ background:#dff5d5; color:#1b4d12;}
.abs{ background:#dbeeff; color:#1b4d66;}
.run{ background:#ffe9cc; color:#7a4d00;}
.swim{ background:#d9fff2; color:#00664d;}

.checklist label{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
  cursor:pointer;
}

input{
  width:16px;
  height:16px;
}

.intense{
  border:2px solid #ff4500;
}
</style>
</head>

<body>
<div class="container">

<div class="header">
  <h1>Minha semana</h1>
  <div class="stats">
    <div id="score">0%</div>
    <div id="streak">🔥 0</div>
    <div class="progress-bar"><div class="progress" id="bar"></div></div>
  </div>
</div>

<div id="app"></div>

</div>

<script>

const checklist = [
"Multivitamínico",
"Creatina",
"Whey Leite",
"Whey Carne",
"3L Água"
];

const days = [
  {name:"Segunda", rest:true},
  {name:"Terça", treino:[
    {p:"Manhã", t:[["Academia","gym"]]},
    {p:"Tarde", t:[["Abdômen","abs"]]}
  ]},
  {name:"Quarta", rest:true},
  {name:"Quinta", treino:[
    {p:"Tarde", t:[["Abdômen","abs"],["Academia","gym"]]},
    {p:"Noite", t:[["Corrida 5km","run"]]}
  ]},
  {name:"Sexta", treino:[{p:"Dia", t:[["Academia","gym"]]}]},
  {name:"Sábado", intense:true, treino:[
    {p:"Manhã", t:[["Natação","swim"]]},
    {p:"Noite", t:[["Corrida 10km+","run"]]}
  ]},
  {name:"Domingo", treino:[{p:"Dia", t:[["Academia","gym"]]}]}
];

const app = document.getElementById("app");

function save(){
  const data = {};
  document.querySelectorAll("input").forEach(i=>{
    data[i.id] = i.checked;
  });
  localStorage.setItem("planner", JSON.stringify(data));
  update();
}

function load(){
  const data = JSON.parse(localStorage.getItem("planner")||"{}");
  document.querySelectorAll("input").forEach(i=>{
    i.checked = data[i.id] || false;
  });
}

function update(){
  const inputs = document.querySelectorAll("input");
  let total = inputs.length;
  let done = [...inputs].filter(i=>i.checked).length;

  let percent = Math.round((done/total)*100);
  document.getElementById("score").innerText = percent+"%";
  document.getElementById("bar").style.width = percent+"%";

  let streak = 0;
  days.forEach((d,i)=>{
    let ok = checklist.every((_,j)=>{
      let el = document.getElementById(`d${i}-${j}`);
      return el && el.checked;
    });
    if(ok) streak++;
  });

  document.getElementById("streak").innerText = "🔥 "+streak;
}

days.forEach((d,i)=>{
  const div = document.createElement("div");
  div.className = "day" + (d.intense ? " intense":"");

  let left = `<div class="left">
    <h2>${d.name}
      <span class="tag ${d.rest?"descanso":"treino"}">
        ${d.rest?"Descanso":"Treino"}
      </span>
    </h2>`;

  if(d.rest){
    left += `<p style="color:#aaa">Recuperação</p>`;
  } else {
    d.treino.forEach(sec=>{
      left += `<div><b>${sec.p}</b><br>`;
      sec.t.forEach(t=>{
        left += `<span class="pill ${t[1]}">${t[0]}</span>`;
      });
      left += `</div>`;
    });
  }

  left += "</div>";

  let right = `<div class="right checklist">`;
  checklist.forEach((c,j)=>{
    right += `<label>
      <input type="checkbox" id="d${i}-${j}" onchange="save()">
      ${c}
    </label>`;
  });
  right += "</div>";

  div.innerHTML = left + right;
  app.appendChild(div);
});

load();
update();

</script>

</body>
</html>
