<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner Premium</title>

<style>
body{
  margin:0;
  background:linear-gradient(180deg,#0b0b0b,#111);
  font-family:-apple-system, BlinkMacSystemFont;
  color:#fff;
}

.container{padding:16px; max-width:900px; margin:auto;}

.header{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:20px;
}

.card{
  backdrop-filter: blur(12px);
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;
  margin-bottom:12px;
  display:flex;
  overflow:hidden;
  transition:.2s;
}

.card:hover{transform:scale(1.01);}

.left{width:55%; padding:15px;}
.right{width:45%; padding:15px; border-left:1px solid rgba(255,255,255,0.1);}

.pill{
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  margin:3px;
  display:inline-block;
}

.gym{background:#dff5d5;color:#1b4d12;}
.abs{background:#dbeeff;color:#1b4d66;}
.run{background:#ffe9cc;color:#7a4d00;}
.swim{background:#d9fff2;color:#00664d;}

.checkbox{
  display:flex; align-items:center; gap:8px;
  margin-bottom:8px;
  cursor:pointer;
}

.checkbox input{display:none;}

.custom{
  width:18px; height:18px;
  border-radius:6px;
  border:2px solid #555;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.2s;
}

input:checked + .custom{
  background:#4caf50;
  border-color:#4caf50;
  transform:scale(1.1);
}

input:checked + .custom::after{
  content:"✔";
  color:#fff;
  font-size:12px;
}

.progress{
  height:6px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin-top:8px;
}

.bar{
  height:100%;
  background:#4caf50;
  width:0%;
  transition:.3s;
}

.chart{
  height:80px;
  display:flex;
  align-items:flex-end;
  gap:4px;
  margin-top:10px;
}

.chart div{
  width:10px;
  background:#4caf50;
  border-radius:3px;
}

.intense{
  border:2px solid #ff4500;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
  <div>
    <h2>Minha semana</h2>
    <div id="score">0%</div>
    <div class="progress"><div class="bar" id="bar"></div></div>
  </div>
  <div>
    🔥 <span id="streak">0</span><br>
    🏆 <span id="rank">-</span>
  </div>
</div>

<div id="chart" class="chart"></div>

<div id="app"></div>

</div>

<script>

const checklist=["Multivitamínico","Creatina","Whey Leite","Whey Carne","3L Água"];

const days=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];

const app=document.getElementById("app");

function save(){
  const data={};
  document.querySelectorAll("input").forEach(i=>data[i.id]=i.checked);
  localStorage.setItem("planner",JSON.stringify(data));
  update();
}

function load(){
  const data=JSON.parse(localStorage.getItem("planner")||"{}");
  document.querySelectorAll("input").forEach(i=>i.checked=data[i.id]||false);
}

function update(){
  const inputs=document.querySelectorAll("input");
  let total=inputs.length;
  let done=[...inputs].filter(i=>i.checked).length;
  let percent=Math.round((done/total)*100);

  document.getElementById("score").innerText=percent+"%";
  document.getElementById("bar").style.width=percent+"%";

  // streak
  let streak=0;
  for(let i=0;i<7;i++){
    let ok=true;
    for(let j=0;j<checklist.length;j++){
      let el=document.getElementById(`d${i}-${j}`);
      if(!el.checked) ok=false;
    }
    if(ok) streak++;
  }
  document.getElementById("streak").innerText=streak;

  // ranking
  let rank="Bronze";
  if(percent>80) rank="Elite";
  else if(percent>60) rank="Pro";
  else if(percent>40) rank="Intermediário";
  document.getElementById("rank").innerText=rank;

  // gráfico
  let chart=document.getElementById("chart");
  chart.innerHTML="";
  for(let i=0;i<7;i++){
    let dayDone=0;
    for(let j=0;j<checklist.length;j++){
      if(document.getElementById(`d${i}-${j}`).checked) dayDone++;
    }
    let bar=document.createElement("div");
    bar.style.height=(dayDone*15)+"px";
    chart.appendChild(bar);
  }
}

for(let i=0;i<7;i++){
  let card=document.createElement("div");
  card.className="card"+(i==5?" intense":"");

  let left=`<div class="left">
    <h3>${days[i]}</h3>
    <span class="pill gym">Academia</span>
  </div>`;

  let right=`<div class="right">`;

  checklist.forEach((c,j)=>{
    right+=`
    <label class="checkbox">
      <input type="checkbox" id="d${i}-${j}" onchange="save()">
      <div class="custom"></div>
      ${c}
    </label>`;
  });

  right+="</div>";

  card.innerHTML=left+right;
  app.appendChild(card);
}

load();
update();

</script>

</body>
</html>
